<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Unidades AI-Assisted</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 50px; background-color: #f4f4f9; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, select, button { background-color: #4CAF50; color: white; border: none; cursor: pointer;}
    </style>
</head>
<body>

<div class="card">
    <h2>Conversor de Longitud</h2>
    
    <!-- Value Input -->
    <label for="inputValue">Introduce el valor:</label>
    <input type="number" id="inputValue" placeholder="Ej: 100">

    <!-- Conversion selection -->
    <label for="unitType">Selecciona la conversión:</label>
    <select id="unitType">
        <option value="mtf">Metros a Pies</option>
        <option value="ftm">Pies a Metros</option>
        <option value="ktm">Kilómetros a Millas</option>
        <option value="mtk">Millas a Kilómetros</option>
    </select>

    <button onclick="convert()">Convertir</button>

    <h3 id="resultText">Resultado: -</h3>
</div>

<script>
    /**
     * Main conversion function.
     * This logic was assisted by AI to ensure accuracy.
     */
    function convert() {
        // We obtain the values ​​of the inputs
        const val = parseFloat(document.getElementById('inputValue').value);
        const type = document.getElementById('unitType').value;
        const resultElement = document.getElementById('resultText');

        // Validation: If it's not a number, we notify the user
        if (isNaN(val)) {
            resultElement.innerText = "Por favor, introduce un número válido.";
            return;
        }

        let result = 0;
        let unit = "";

        // Conversion logic based on the selected option
        switch (type) {
            case "mtf": // Metros a Pies (1m = 3.28084ft)
                result = val * 3.28084;
                unit = "pies";
                break;
            case "ftm": // Pies a Metros
                result = val / 3.28084;
                unit = "metros";
                break;
            case "ktm": // Km a Millas (1km = 0.621371mi)
                result = val * 0.621371;
                unit = "millas";
                break;
            case "mtk": // Millas a Km
                result = val / 0.621371;
                unit = "kilómetros";
                break;
        }

        // We show the result rounded to 2 decimal places
        resultElement.innerText = `Resultado: ${result.toFixed(2)} ${unit}`;
    }
</script>

</body>
</html>
